name: gui
# The desktop app (in development): build it on each OS and run the preview
# security probe on that OS's webview. No packaging or release yet.
on:
  push:
    paths: ["gui/**", "src/**", "Cargo.*", ".github/workflows/gui.yml"]
  pull_request:
    paths: ["gui/**", "src/**", "Cargo.*", ".github/workflows/gui.yml"]
jobs:
  gui:
    strategy:
      fail-fast: false
      matrix:
        # 22.04 for the glibc floor of future Linux bundles (move to 24.04
        # before 2027-04-17, when 22.04 runners are retired).
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install WebKitGTK and friends
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Frontend install, type check, lint and build
        working-directory: gui
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm check
          pnpm lint
          pnpm build
      - run: cargo clippy -p tmpmail-gui --all-targets -- -D warnings
      - run: cargo test -p tmpmail-gui
      - name: Build the app (debug, with the probe)
        working-directory: gui
        run: pnpm tauri build --debug --no-bundle
      # The report goes to its own file: GLib prints some messages to stdout,
      # so stdout and stderr both go to probe.log.
      - name: Run the preview probe
        id: probe
        run: |
          bin="$PWD/target/debug/tmpmail-gui"
          tmp="$(mktemp -d)"
          report="$PWD/probe.json"
          rm -f probe.json probe.log
          if [ "$RUNNER_OS" = Windows ]; then
            bin="$bin.exe"
            tmp="$(cygpath -w "$tmp")"
            report="$(cygpath -w "$report")"
          fi
          export TMPMAIL_STATE_DIR="$tmp/state" TMPMAIL_CONFIG="$tmp/no-config.toml" TMPMAIL_GUI_PROBE=1
          export TMPMAIL_GUI_PROBE_REPORT="$report"
          status=0
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a "$bin" > probe.log 2>&1 || status=$?
          else
            "$bin" > probe.log 2>&1 || status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "The probe exited with $status. Its output:"
          cat probe.log
      # Required on every OS, Windows included: valid JSON with "pass": true,
      # and exit code 0.
      - name: Check the probe report
        env:
          PROBE_STATUS: ${{ steps.probe.outputs.status }}
        run: |
          node -e '
            const fs = require("fs");
            let r;
            try {
              r = JSON.parse(fs.readFileSync("probe.json", "utf8"));
            } catch (e) {
              console.error("probe.json is not valid JSON: " + e.message);
              process.exit(1);
            }
            const failed = Object.entries(r.checks || {}).filter(([, v]) => v !== true).map(([k]) => k);
            console.log(`${r.engine} on ${r.os}: pass=${r.pass}, ${Object.keys(r.checks || {}).length} checks`);
            if (failed.length) console.log("failed: " + failed.join(", "));
            console.log(JSON.stringify(r.observations, null, 2));
            const status = process.env.PROBE_STATUS;
            if (r.pass !== true || status !== "0") {
              console.error(`the probe did not pass (pass=${r.pass}, exit ${status})`);
              process.exit(1);
            }
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-${{ matrix.os }}
          path: |
            probe.json
            probe.log
          if-no-files-found: ignore
