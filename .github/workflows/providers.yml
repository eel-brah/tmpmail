# Daily check that the free providers still work, so a dead backend is
# noticed before users hit it (the way 1secmail broke the original tmpmail).
# A failure opens an issue labelled `provider-down` (or comments on the open
# one); the next passing run closes it.
name: providers
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `shell: bash` adds pipefail, so tee doesn't hide a failure.
      - run: ./scripts/smoke.sh 2>&1 | tee smoke.log
        shell: bash
      - name: Open or update the provider-down issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create provider-down --color B60205 \
            --description "Opened by the daily provider check" 2>/dev/null || true
          body="$(printf 'The daily provider check failed: %s\n\n```\n%s\n```\n' \
            "$RUN_URL" "$(tail -n 40 smoke.log 2>/dev/null)")"
          open="$(gh issue list --label provider-down --state open --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Provider check failing" --label provider-down --body "$body"
          fi
      - name: Close the provider-down issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label provider-down --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The provider check passes again."
          done
