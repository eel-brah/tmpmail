# Daily check that the free providers still work, so a dead backend is
# noticed before users hit it (the way 1secmail broke the original tmpmail).
# It runs on Linux, macOS and Windows. A run (and the badge) fails only when
# every provider is down from one of them, or tmpmail doesn't build there. Any
# provider failing on any OS opens an issue labelled `provider-down` (or
# comments on the open one); the next run where all of them pass closes it.
name: providers
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `shell: bash` adds pipefail, so tee doesn't hide a failure. On
      # Windows it is Git Bash.
      - run: ./scripts/smoke.sh 2>&1 | tee smoke.log
        shell: bash
      - name: Record the result
        if: always()
        shell: bash
        run: echo "${{ job.status }}" > status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ runner.os }}
          path: |
            smoke.log
            status
  # One job sees every OS, so there is a single issue update per run.
  report:
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: logs
          pattern: smoke-*
      - name: Look for providers that are down
        id: down
        run: |
          : > summary.txt
          : > logs.txt
          for os in Linux macOS Windows; do
            d="logs/smoke-$os"
            status="$(cat "$d/status" 2>/dev/null || echo "no result")"
            fails="$(grep '^FAIL' "$d/smoke.log" 2>/dev/null || true)"
            if [ "$status" != success ]; then
              echo "- $os: the check failed ($status)" >> summary.txt
            elif [ -n "$fails" ]; then
              echo "- $os: some providers are down" >> summary.txt
            else
              continue
            fi
            echo "$fails" | sed "/^$/d; s/^/::warning::$os /"
            printf '### %s\n\n```\n%s\n```\n\n' "$os" \
              "$(tail -n 40 "$d/smoke.log" 2>/dev/null)" >> logs.txt
          done
          if [ -s summary.txt ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update the provider-down issue
        if: steps.down.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create provider-down --color B60205 \
            --description "Opened by the daily provider check" 2>/dev/null || true
          {
            printf 'The daily provider check found a provider down: %s\n\n' "$RUN_URL"
            cat summary.txt
            echo
            cat logs.txt
          } > body.md
          open="$(gh issue list --label provider-down --state open --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file body.md
          else
            gh issue create --title "Provider check failing" --label provider-down --body-file body.md
          fi
      - name: Close the provider-down issue
        if: steps.down.outcome == 'success' && steps.down.outputs.any != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list --label provider-down --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The provider check passes again."
          done
