# Builds release archives on a `v*` tag and publishes them as a GitHub
# release with SHA256SUMS. Every file gets a build provenance attestation,
# checked with `gh attestation verify FILE --repo qorvyx/tmpmail`.
# Running it by hand (workflow_dispatch) only builds, as a dry run.
# `gui-v*` tags (the desktop app) don't match `v*`, so they don't run it.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Stops before any build if the tag isn't the crate's version (`v0.3.0`
  # for `version = "0.3.0"` in the root Cargo.toml), or if Cargo.lock is
  # stale (every build runs `--locked`).
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tmpmail") | .version')
          if [ -z "$crate" ]; then
            echo "::error::no tmpmail package in the root Cargo.toml"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "Not a tag; Cargo.toml says $crate"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $crate"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches Cargo.toml"
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="dev"
          name="tmpmail-$version-$TARGET"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/tmpmail.exe" "$name/"
            7z a -bd "$name.zip" "$name" >/dev/null
          else
            cp "target/$TARGET/release/tmpmail" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
          ls -l tmpmail-*.*
      - uses: actions/attest-build-provenance@v4
        if: github.ref_type == 'tag'
        with:
          subject-path: "tmpmail-*.*"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            tmpmail-*.tar.gz
            tmpmail-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum tmpmail-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          --title "tmpmail ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS

  # Updates Formula/tmpmail.rb in qorvyx/homebrew-tap. Needs the
  # HOMEBREW_TAP_TOKEN secret: a fine-grained token with contents write access
  # to that repository only.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS
      - uses: actions/checkout@v7
        with:
          repository: qorvyx/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - run: |
          scripts/homebrew-formula.sh "${GITHUB_REF_NAME#v}" SHA256SUMS > tap/Formula/tmpmail.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tmpmail.rb
          git commit -m "tmpmail ${GITHUB_REF_NAME#v}"
          git push
