[package]
name = "tmpmail"
version = "0.3.1"
edition = "2024"
description = "Temporary email from the terminal: multiple providers, automatic fallback, wait/OTP/JSON for automation"
license = "GPL-3.0-or-later"
rust-version = "1.85"
repository = "https://github.com/qorvyx/tmpmail"
readme = "README.md"
keywords = ["email", "temporary", "disposable", "otp", "cli"]
categories = ["command-line-utilities", "email"]
include = ["/src", "/docs", "/README.md", "/LICENSE", "/Cargo.lock"]

[workspace]
# The desktop app (released on its own `gui-v*` tags). Plain `cargo build`
# and `cargo test` here still only build the CLI.
members = [".", "gui/src-tauri"]

# Lets `cargo binstall tmpmail` fetch the release archive instead of building.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
ammonia = "4.2.1"
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"], optional = true }
clap_complete = { version = "4.6.11", optional = true }
clap_mangen = { version = "0.3.3", optional = true }
dirs = "7.0.0"
html2text = "0.17.1"
qrcode = { version = "0.14.1", optional = true }
rand = "0.9"
ratatui = { version = "0.29.0", optional = true }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"

[features]
default = ["cli"]
# The command line, TUI and MCP server. The desktop app builds the lib without
# it, so it doesn't link clap, ratatui or qrcode.
cli = ["dep:clap", "dep:clap_complete", "dep:clap_mangen", "dep:qrcode", "dep:ratatui", "dep:windows-sys"]

[[bin]]
name = "tmpmail"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3.27.0"

[profile.release]
lto = true
strip = true
codegen-units = 1

[target."cfg(unix)".dependencies]
libc = "0.2.190"

# Console colors and handle inheritance (system.rs); already in the tree.
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_System_Console"] }
