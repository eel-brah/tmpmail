[package]
name = "tmpmail"
version = "0.1.2"
edition = "2024"
description = "Temporary email from the terminal: multiple providers, automatic fallback, wait/OTP/JSON for automation"
license = "GPL-3.0-or-later"
rust-version = "1.85"
repository = "https://github.com/qorvyx/tmpmail"
readme = "README.md"
keywords = ["email", "temporary", "disposable", "otp", "cli"]
categories = ["command-line-utilities", "email"]
include = ["/src", "/docs", "/README.md", "/LICENSE", "/Cargo.lock"]

# Lets `cargo binstall tmpmail` fetch the release archive instead of building.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
ammonia = "4.2.1"
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
dirs = "7.0.0"
html2text = "0.17.1"
qrcode = "0.14.1"
rand = "0.9"
ratatui = "0.29.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3.27.0"

[profile.release]
lto = true
strip = true
codegen-units = 1

[target."cfg(unix)".dependencies]
libc = "0.2.190"
