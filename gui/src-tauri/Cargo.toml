[package]
name = "tmpmail-gui"
version = "0.1.1"
edition = "2024"
description = "Desktop app for tmpmail"
license = "GPL-3.0-or-later"
rust-version = "1.90"
publish = false

[[bin]]
name = "tmpmail-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# The core only: no clap, ratatui or qrcode.
tmpmail = { path = "../..", default-features = false }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.8.0"
# Writes config.toml keeping the user's comments and unknown keys.
toml_edit = "0.25"
tempfile = "3.27.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

# Dragging attachments out (the engine of `tauri-plugin-drag`, used from Rust
# only). Not on Windows: a drag there can hang the whole app (drag-rs #94).
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
drag = "2.1.1"

# Windows: a click on a notification in the notification center starts the
# app with a link (notify.rs); the plugin hands it to the running app. The
# toast is built with the WinRT bindings already in the tree.
[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2.5.5"
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKUserContentController"] }

# Body markup support of the notification server, and whether a tray host
# runs (both over D-Bus); already in the tree through the notification plugin.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18.2"
# The program name GTK gives the window's X11 class and Wayland app ID
# (main.rs), and handing a notification click's activation token to the
# window (freedesktop.rs); already in the tree through tao and wry.
gtk = "0.18.2"
gdkx11 = "0.18.2"
gdkwayland-sys = "0.18.2"
# Turning off the postMessage IPC route (caller.rs); already in the tree
# through wry, on every OS below.
webkit2gtk = "2.0.2"
zbus = { version = "5.13.2", default-features = false, features = ["blocking-api", "async-io"] }
